[workspace]
members = [
    "crates/types"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/okoala-org/okoala-base"
authors = ["The OKoala contributors"]

[workspace.dependencies]
okoala-types = { path = "crates/types", version = "0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
proptest = "1.8.0"
insta = { version = "1.43.0", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = "s"
lto = true
